    <main>
        <div id="container" class="container show-card">
            <!-- Sección de login -->
            <section id="iniciarSeccion">
                <form id="initSection">
                    <h2 class="subtitle">Iniciar Sesión</h2>
                    <label for="email-login">Correo</label>
                    <input type="email" id="email-login" name="email" placeholder="Correo electrónico" required>
                    <label for="password-login">Contraseña</label>
                    <input type="password" id="password-login" name="password" placeholder="Contraseña" required>
                    <button type="submit" class="btn">Iniciar Sesion</button>
                </form>
                <p class="error-p"></p>
                <a href="#" id="none_init">No tengo cuenta</a>
            </section>
            <!-- Sección de registro -->
            <section id="registrarse">
                <form id="register">
                    <h2 class="subtitle">Registrarse</h2>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required>
                    <label for="email-register">Correo</label>
                    <input type="email" id="email-register" name="email-register" placeholder="Correo electrónico"
                        required>
                    <label for="edad">Edad</label>
                    <input type="text" id="edad" name="edad" placeholder="edad" required>
                    <label for="password-register">Contraseña</label>
                    <input type="password" id="password-register" name="password" placeholder="Contraseña" required>
                    <label for="password-confiRegister">Confirmar contraseña</label>
                    <input type="password" id="password-confRegister" name="passwordConf"
                        placeholder="confirma tu contraseña" required>
                    <button type="submit" class="btn">Registrarse</button>
                </form>
                <p class="error-p"></p>
                <a href="#" id="none_reg">Ya tengo cuenta</a>
            </section>
            <!-- seccion de perfil -->
            <section id="perfil">
                <form class="perfil initForm">
                    <h2 class="subtitle">Foto de Perfil</h2>
                    <!-- <div id="imgChange"></div> -->
                    <img id="imgChange" src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20fill='rgb(0,%20110,%20255)'%20class='bi%20bi-person-circle'%20viewBox='0%200%2016%2016'%3e%3cpath%20d='M11%206a3%203%200%201%201-6%200%203%203%200%200%201%206%200'/%3e%3cpath%20fill-rule='evenodd'%20d='M0%208a8%208%200%201%201%2016%200A8%208%200%200%201%200%208m8-7a7%207%200%200%200-5.468%2011.37C3.242%2011.226%204.805%2010%208%2010s4.757%201.225%205.468%202.37A7%207%200%200%200%208%201'/%3e%3c/svg%3e" alt="">
                    <br>
                    <div class="botones">
                        <div class="cambiar">
                            <button type="button" id="btn-cambiar" class="btn-cambiar">Mofificar Datos</button>
                        </div>
                        <div class="otros_cambiar">
                            <button type="button" id="btn-cancelar" class="btn-2">Cancelar</button>
                            <button type="button" id="btn-guardar" class="btn-2">Guardar</button>
                        </div>
                    </div>
                </form>
            </section>
        </div>
        <!-- contenedor de las notas -->
        <div id="cont-notes" class="cont-notes">
            <!-- sección de notas -->
            <section>
                <!-- formulario para hacer una nota -->
                <form id="form-notes" class="form-notes">
                    <h2>Hacer una anotación</h2>
                    <label for="note-title-input">
                        <span>Titulo de la nota</span>
                        <input type="text" id="note-title-input" required placeholder="Colocale un titulo a la nota">
                    </label>

                    <label for="note-desc-input">
                        <span>Descripción de la nota</span>
                        <textarea id="note-desc-input" required placeholder="Haz una descripción de la nota"></textarea>
                    </label>

                    <button type="submit" class="btn-2">Agregar Nota</button>
                </form>

                <div class="cont-categorias">
                    <hr>
                    <select id="agruparNotas" class="agruparNotas">
                        <option style="color: black;" value="0">Todas</option>
                        <option style="color: orange;" value="1">Pendiente</option>
                        <option style="color: green;" value="2">Completada</option>
                        <option selected style="color: red;" value="3">No Completada</option>
                    </select>
                    <hr>
                </div>

        <div class="modal-datos modal-hidden">
            <div class="cont-modal">
                <form id="diferente">
                    <h2 class="subtitle">Modificar Datos</h2>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombreModificar" name="nombre" placeholder="Escribe tu nombre" required>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellidoModificar" name="apellido" placeholder="Escribe tu apellido"
                        required>
                    <label for="email-register">Correo</label>
                    <input type="email" id="email-registerModificar" name="email-register"
                        placeholder="Correo electrónico" required>
                    <label for="edad">Edad</label>
                    <input type="text" id="edadModificar" name="edad" placeholder="edad" required>
                    <label for="password-anterior">Contraseña anterior</label>
                    <input type="password" id="password-anterior" name="password" placeholder="Contraseña anterior"
                        required>
                    <label for="password-register">Contraseña nueva</label>
                    <input type="password" id="password-registerModificar" name="password"
                        placeholder="Contraseña nueva" required>
                    <label for="password-confiRegister">Confirmar contraseña</label>
                    <input type="password" id="password-confRegisterModificar" name="confirma contraseña nueva"
                        placeholder="confirma tu contraseña" required>
                    <div class="bottModificar">
                        <button type="button" class="btn">Cancelar</button>
                        <button type="submit" class="btn">Modificar</button>
                    </div>
                </form>
                <p class="error-p"></p>
            </div>
        </div>

        <div class="modal-notas modal-hidden">
            <div class="cont-modal">
                <form id="formModificarNotas" class="diferente">
                    <h2 class="subtitle">Modificar Nota</h2>
                    <label for="note-title-input">
                        <span>Titulo de la nota</span>
                        <input type="text" id="mod-note-title-input" required placeholder="Colocale un titulo a la nota">
                    </label>
    
                    <label for="note-desc-input">
                        <span>Descripción de la nota</span>
                        <textarea id="mod-note-desc-input" required placeholder="Haz una descripción de la nota"></textarea>
                    </label>
                    <div class="bottModificar">
                        <button type="button" class="btn-2">cancelar</button>
                        <button type="submit" class="btn-2">Actualizar</button>
                    </div>
                </form>

            </div>
        </div>

        <div class="modal-image modal-hidden">
            <div class="cont-modal">
                <form id="formChangeImage" class="diferente">

                    <div class="bottModificar">
                        <button type="button" class="btn-2">Cancelar</button>
                        <button type="submit" class="btn-2">actualizar</button>

                    </div>
                </form>
            </div>
        </div>
